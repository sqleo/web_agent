<script>
const STEPS = ['意图确认','调研进行','大纲审核','并行撰写','最终报告'];
const STEP_COLORS = ['run','run','wait','run','done'];

let cur = 0;

const stepNavData = STEPS.map((s,i)=>({label:s,state:i<cur?'done':i===cur?'active':''}));

function renderProgress(active) {
  const el = document.getElementById('psteps');
  let h='';
  for(let i=0;i<5;i++){
    const st = i<active?'done':i===active?'active':'';
    h+=`<div class="ps ${st}"><div class="psd">${st==='done'?'✓':i+1}</div></div>`;
    if(i<4) h+=`<div class="pl ${i<active?'done':''}"></div>`;
  }
  el.innerHTML=h;
}

function renderStepNav(active) {
  const el = document.getElementById('stepNav');
  el.innerHTML = STEPS.map((s,i)=>{
    const cls = i<active?'done':i===active?'active':'';
    return `<div class="sn ${cls}" onclick="goStep(${i})">${s}</div>`;
  }).join('');

  el.innerHTML = all.map(l=>{
    if(l.t==='user') return `<div class="lu"><div class="lub">${l.text}</div></div>`;
    if(l.t==='agent') return `<div class="la"><div class="av">A</div><div class="lab">${l.text}</div></div>`;
    if(l.t==='wait') return `<div class="lwait"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1"/><path d="M5 3v2l1.5 1" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>${l.text}</div>`;

  el.scrollTop = el.scrollHeight;

function updateBadges(step) {
  const b = BADGE_STATES[step];
  const mid = document.getElementById('midBadge');
  const right = document.getElementById('rightBadge');
  mid.className = 'sbadge '+b.midCls;
  mid.innerHTML = `<div style="width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8;flex-shrink:0"></div><span>${b.mid}</span>`;
  right.className = 'hbadge '+b.rightCls;
  right.textContent = b.right;
}

function rewindAnim() {
  const rc = document.getElementById('rightContent');
  rc.style.animation = 'rewind .6s ease-in-out';
  setTimeout(()=>{ rc.style.animation=''; goStep(1); },500);
}

function goStep(n) {
  cur = Math.max(0, Math.min(4, n));
  renderProgress(cur);
  renderStepNav(cur);
  renderLogs(cur);
  renderRight(cur);
  updateBadges(cur);
}

goStep(0);
